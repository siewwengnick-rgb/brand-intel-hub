<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0b0f17">
<title>品牌情报台</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="app">
  <aside class="side" aria-label="菜单">
    <div class="side-brand">
      <span class="side-logo" aria-hidden="true">OF</span>
      <div><b>品牌情报台</b><small>Orthotech · Foamfresh</small></div>
    </div>
    <nav class="side-nav" id="side-nav"></nav>
    <div class="side-foot">
      <label class="side-who-l" for="who">你是谁</label>
      <select id="who" class="who" aria-label="你是谁"></select>
    </div>
  </aside>

  <main class="main" id="main-wrap">
    <div class="pagehead">
      <h1 id="pg-title"></h1>
      <span class="pg-date" id="pg-date"></span>
    </div>
    <p class="pg-sub" id="pg-sub"></p>
    <div class="filters" id="filters">
      <div class="datebox" id="f-date">
        <button type="button" id="prev" class="nav" title="前一天" aria-label="前一天">◀</button>
        <select id="date" aria-label="日期"></select>
        <button type="button" id="next" class="nav" title="后一天" aria-label="后一天">▶</button>
      </div>
      <div class="chips" id="span" role="group" aria-label="时间范围">
        <button type="button" data-span="week" class="chip on" aria-pressed="true">近7天</button>
        <button type="button" data-span="day" class="chip" aria-pressed="false">这一天</button>
      </div>
      <div class="chips" id="brand" role="group" aria-label="品牌">
        <button type="button" data-brand="ALL" class="chip on">全部</button>
        <button type="button" data-brand="OT" class="chip c-ot">OT</button>
        <button type="button" data-brand="FF" class="chip c-ff">FF</button>
      </div>
      <div class="chips" id="plats" role="group" aria-label="平台" hidden></div>
      <input type="search" id="q" placeholder="搜索 产品 / 简报 / 标题" autocomplete="off" aria-label="搜索">
    </div>
    <div id="main"></div>
  </main>
</div>

<div id="sheet" class="sheet" hidden>
  <div class="scrim" data-close></div>
  <section class="panel" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <div class="grip" aria-hidden="true"><span></span></div>
    <div class="ph-bar">
      <span id="sheet-kind" class="sheet-kind"></span>
      <button type="button" class="x" data-close aria-label="关闭">✕</button>
    </div>
    <div class="sheet-body" id="sheet-body"></div>
    <div class="sheet-foot" id="sheet-foot"></div>
  </section>
</div>
<!-- config.js 可以没有（见 config.example.js） -->
<script src="config.js"></script>
<script src="js/normalize.js"></script>
<script src="js/insights.js"></script>
<script src="js/store.js"></script>
<script src="js/router.js"></script>
<script src="js/app.js"></script>
</body>
</html>
